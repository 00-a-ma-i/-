{% extends "base.html" %}
{% block title %}我的博客 - 登录{% endblock %}
{% block content %}
    <h2>管理员登录</h2>
    <form action="{{ url_for('login')}}" method="post">
        <div class="form-group">
            <label for="">密码</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn">登录</button>
    </form>
{% endblock %}
